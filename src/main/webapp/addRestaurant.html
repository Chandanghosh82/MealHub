<div class="container">

    <h1>Add Restaurant</h1>

    <form action="addRestaurant" method="post">

        <label>Restaurant Name</label>
        <input type="text" name="restaurantName" required>

        <label>Location</label>
        <input type="text" name="location" required>

        <label>Phone</label>
